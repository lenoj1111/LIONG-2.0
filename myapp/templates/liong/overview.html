<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Overview</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js"></script>
    <script src="components/navbar.js"></script>
    <script src="components/footer.js"></script>
    <script src="sidebar.js"></script>
</head>
<body class="bg-gray-50 overflow-x-hidden">
    <custom-sidebar></custom-sidebar>
    <main class="container mx-auto px-4 py-8 md:ml-64 ml-0 max-w-7xl">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
            <h1 class="text-3xl font-bold text-gray-900">Overview</h1>
            <a href="employees.html" class="px-6 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition font-medium flex items-center gap-2">
                <i data-feather="plus" class="h-5 w-5"></i>
                Add Employee
            </a>
        </div>

        <!-- Employee count box -->
        <div class="mb-6">
            <div class="bg-white rounded-lg shadow p-4 w-full md:w-56 max-w-sm">
                <div class="text-sm text-gray-500">Total Employees</div>
                <div id="employeeCount" class="text-2xl font-bold text-gray-900">0</div>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div id="dashboardCards" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6 mb-8">
            <!-- populated by JS -->
        </div>

        <!-- Recent Employees -->
        <div class="bg-white rounded-lg shadow p-6">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-semibold text-gray-800">List of Employees</h2>
                <select id="roleFilter" class="px-4 py-2 border border-gray-300 rounded-lg bg-white text-gray-700 hover:border-gray-400 focus:outline-none focus:border-blue-600">
                    <option value="">All Roles</option>
                    <option value="Manager">Manager</option>
                    <option value="Supervisor">Supervisor</option>
                    <option value="Staff">Staff</option>
                    <option value="Warehouse">Warehouse</option>
                </select>
            </div>
            <div class="overflow-x-auto">
                <table class="min-w-0 w-full divide-y divide-gray-200">
                    <thead class="bg-gray-100">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider max-w-[220px] truncate">Name</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider max-w-[160px] truncate">Role</th>
                            <th class="px-6 py-3 text-left text-xs font-semibold text-gray-700 uppercase tracking-wider max-w-[160px] truncate">Date Joined</th>
                        </tr>
                    </thead>
                    <tbody id="recentEmployeeTableBody" class="bg-white divide-y divide-gray-200">
                        <!-- populated by JS -->
                    </tbody>
                </table>
            </div>
            <!-- Pagination -->
            <div class="mt-6 flex justify-center items-center gap-2" id="paginationContainer">
                <!-- populated by JS -->
            </div>
        </div>
    </main>
    <custom-footer></custom-footer>

    <script>
        let employees = JSON.parse(localStorage.getItem('employees')) || [];
        let currentPage = 1;
        const employeesPerPage = 5;
        let selectedRole = '';

        function normalizeEmployees() {
            let changed = false;
            employees = employees.map(emp => {
                if (!emp.contactType && ('email' in emp || 'contact' in emp)) {
                    changed = true;
                    const contactRaw = emp.contact || emp.email || '';
                    return {
                        id: emp.id || ('EMP-' + (Date.now().toString().slice(-6))),
                        name: emp.name || '',
                        contactType: contactRaw && contactRaw !== 'N/A' && contactRaw.includes('@') ? 'email' :
                                     (contactRaw && contactRaw !== 'N/A') ? 'phone' : 'email',
                        contactValue: contactRaw && contactRaw !== '' ? contactRaw : 'N/A',
                        role: emp.role || '',
                        date: emp.date || (emp.joined || '') || ''
                    };
                }
                return {
                    id: emp.id || ('EMP-' + (Date.now().toString().slice(-6))),
                    name: emp.name || '',
                    contactType: emp.contactType || 'email',
                    contactValue: (emp.contactValue || emp.email || 'N/A') || 'N/A',
                    role: emp.role || '',
                    date: emp.date || ''
                };
            });
            if (changed) localStorage.setItem('employees', JSON.stringify(employees));
        }

        const recentEmployeeTableBody = document.getElementById('recentEmployeeTableBody');

        function getRoleColor(role) {
            const roleColors = {
                'Manager': 'bg-purple-100 text-purple-800',
                'Supervisor': 'bg-blue-100 text-blue-800',
                'Staff': 'bg-gray-100 text-gray-800',
                'Warehouse': 'bg-orange-100 text-orange-800'
            };
            return roleColors[role] || 'bg-indigo-100 text-indigo-800';
        }

        function updateCounts() {
            document.getElementById('employeeCount').textContent = employees.length;
        }

        function generateDashboardCards() {
            const dashboardCards = document.getElementById('dashboardCards');
            dashboardCards.innerHTML = '';

            const uniqueRoles = [...new Set(employees.map(emp => emp.role).filter(role => role && role !== ''))].sort();
            
            const roleIcons = {
                'Manager': 'briefcase',
                'Supervisor': 'users',
                'Staff': 'user',
                'Warehouse': 'box'
            };

            const roleColors = {
                'Manager': 'blue',
                'Supervisor': 'green',
                'Staff': 'purple',
                'Warehouse': 'orange'
            };

            uniqueRoles.forEach(role => {
                const count = employees.filter(emp => emp.role === role).length;
                const icon = roleIcons[role] || 'user';
                const color = roleColors[role] || 'indigo';

                const card = document.createElement('div');
                // make cards responsive and limited in width so they don't force horizontal scroll
                card.className = 'bg-white rounded-lg shadow p-6 w-full max-w-full';
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div>
                            <p class="text-gray-500 text-sm">${escapeHtml(role)}</p>
                            <p class="text-2xl font-bold text-gray-900">${count}</p>
                        </div>
                        <i data-feather="${icon}" class="text-${color}-600 h-8 w-8"></i>
                    </div>
                `;
                dashboardCards.appendChild(card);
            });

            if (window.feather) feather.replace();
        }

        function escapeHtml(str) {
            if (!str) return '';
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function renderRecentEmployees(page = 1) {
            updateCounts();
            recentEmployeeTableBody.innerHTML = '';
            currentPage = page;

            const filteredEmployees = selectedRole 
                ? employees.filter(emp => emp.role === selectedRole)
                : employees;

            const startIndex = (page - 1) * employeesPerPage;
            const endIndex = startIndex + employeesPerPage;
            const paginatedEmployees = filteredEmployees.slice(startIndex, endIndex);

            if (filteredEmployees.length === 0) {
                recentEmployeeTableBody.innerHTML = `
                    <tr>
                        <td colspan="3" class="px-6 py-8 text-center text-gray-500">No employees found</td>
                    </tr>
                `;
                renderPagination(filteredEmployees.length);
                if (window.feather) feather.replace();
                return;
            }

            paginatedEmployees.forEach(emp => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-gray-50 transition';
                tr.innerHTML = `
                    <td class="px-6 py-4 whitespace-nowrap max-w-[220px] truncate">
                        <div class="flex items-center min-w-0">
                            <div class="flex-shrink-0 h-10 w-10 rounded-full bg-blue-100 flex items-center justify-center">
                                <i data-feather="user" class="text-blue-600"></i>
                            </div>
                            <div class="ml-4 min-w-0">
                                <div class="text-sm font-medium text-gray-900 truncate">${escapeHtml(emp.name)}</div>
                            </div>
                        </div>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap max-w-[160px] truncate">
                        <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full ${getRoleColor(emp.role)}">
                            ${escapeHtml(emp.role || '')}
                        </span>
                    </td>
                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600 max-w-[160px] truncate">${escapeHtml(emp.date || '')}</td>
                `;
                recentEmployeeTableBody.appendChild(tr);
            });

            renderPagination(filteredEmployees.length);
            if (window.feather) feather.replace();
        }

        function renderPagination(totalEmployees = employees.length) {
            const paginationContainer = document.getElementById('paginationContainer');
            paginationContainer.innerHTML = '';

            const totalPages = Math.ceil(totalEmployees / employeesPerPage);

            if (totalPages <= 1) return;

            // Previous button
            const prevBtn = document.createElement('button');
            prevBtn.textContent = 'Previous';
            prevBtn.className = `px-4 py-2 rounded-lg font-medium transition ${
                currentPage === 1
                    ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
            }`;
            prevBtn.disabled = currentPage === 1;
            prevBtn.addEventListener('click', () => {
                if (currentPage > 1) renderRecentEmployees(currentPage - 1);
            });
            paginationContainer.appendChild(prevBtn);

            // Page number buttons (show up to 5 pages at a time)
            const maxPagesShown = 5;
            let startPage = Math.max(1, currentPage - Math.floor(maxPagesShown / 2));
            let endPage = Math.min(totalPages, startPage + maxPagesShown - 1);

            if (endPage - startPage + 1 < maxPagesShown) {
                startPage = Math.max(1, endPage - maxPagesShown + 1);
            }

            // Show first page if not in range
            if (startPage > 1) {
                const firstBtn = document.createElement('button');
                firstBtn.textContent = '1';
                firstBtn.className = 'px-3 py-2 rounded-lg font-medium transition bg-gray-200 text-gray-700 hover:bg-gray-300';
                firstBtn.addEventListener('click', () => renderRecentEmployees(1));
                paginationContainer.appendChild(firstBtn);

                if (startPage > 2) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.className = 'px-2 py-2 text-gray-600';
                    paginationContainer.appendChild(dots);
                }
            }

            for (let i = startPage; i <= endPage; i++) {
                const button = document.createElement('button');
                button.textContent = i;
                button.className = `px-3 py-2 rounded-lg font-medium transition ${
                    i === currentPage
                        ? 'bg-blue-600 text-white'
                        : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
                }`;
                button.addEventListener('click', () => renderRecentEmployees(i));
                paginationContainer.appendChild(button);
            }

            // Show last page if not in range
            if (endPage < totalPages) {
                if (endPage < totalPages - 1) {
                    const dots = document.createElement('span');
                    dots.textContent = '...';
                    dots.className = 'px-2 py-2 text-gray-600';
                    paginationContainer.appendChild(dots);
                }

                const lastBtn = document.createElement('button');
                lastBtn.textContent = totalPages;
                lastBtn.className = 'px-3 py-2 rounded-lg font-medium transition bg-gray-200 text-gray-700 hover:bg-gray-300';
                lastBtn.addEventListener('click', () => renderRecentEmployees(totalPages));
                paginationContainer.appendChild(lastBtn);
            }

            // Next button
            const nextBtn = document.createElement('button');
            nextBtn.textContent = 'Next';
            nextBtn.className = `px-4 py-2 rounded-lg font-medium transition ${
                currentPage === totalPages
                    ? 'bg-gray-200 text-gray-400 cursor-not-allowed'
                    : 'bg-gray-200 text-gray-700 hover:bg-gray-300'
            }`;
            nextBtn.disabled = currentPage === totalPages;
            nextBtn.addEventListener('click', () => {
                if (currentPage < totalPages) renderRecentEmployees(currentPage + 1);
            });
            paginationContainer.appendChild(nextBtn);
        }

        function populateRoleFilter() {
            const roleFilter = document.getElementById('roleFilter');
            const uniqueRoles = [...new Set(employees.map(emp => emp.role).filter(role => role && role !== ''))].sort();
            
            roleFilter.innerHTML = '<option value="">All Roles</option>';
            
            uniqueRoles.forEach(role => {
                const option = document.createElement('option');
                option.value = role;
                option.textContent = role;
                roleFilter.appendChild(option);
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            normalizeEmployees();
            generateDashboardCards();
            populateRoleFilter();
            renderRecentEmployees();

            const roleFilter = document.getElementById('roleFilter');
            roleFilter.addEventListener('change', (e) => {
                selectedRole = e.target.value;
                currentPage = 1;
                renderRecentEmployees();
            });
        });
    </script>
</body>
</html>
